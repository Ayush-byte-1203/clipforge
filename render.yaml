services:
  - type: web
    name: clipforge
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CLIPFORGE_DATA
        value: /data
      - key: CLIPFORGE_HOST
        value: 0.0.0.0
      - key: RENDER
        value: "true"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: LOW_MEMORY
        value: "1"
